<section id="maw-entrance-study-v1">
  <h3>Maw entrance · raised, tooth-packed rim</h3>
  <div class="text-small">120 tiles across · blue figure = 2 × 3 tiles · geometry only, not final art</div>
  <svg class="maw-scene" role="img" aria-label="Tile-scale Maw entrance: tall inward-curling rim ridges rise above two side basins. Closely spaced teeth crowd both ridges and the throat, without resting ledges. Players use rope or mine teeth. Blue player on the outside surface provides scale."></svg>
  <div class="maw-legend text-small">
    <span><i class="terrain-swatch"></i>Solid bank</span>
    <span><i class="tooth-swatch"></i>Brittle tooth</span>
    <span><i class="pool-swatch"></i>Reserved acid basin</span>
    <span><i class="route-swatch"></i>Open descent</span>
  </div>
</section>
<style>
#maw-entrance-study-v1 .maw-scene{display:block;width:100%;overflow:visible}
#maw-entrance-study-v1 .maw-legend{display:flex;flex-wrap:wrap;gap:8px 18px}
#maw-entrance-study-v1 .maw-legend span{display:inline-flex;align-items:center;gap:6px}
#maw-entrance-study-v1 .maw-legend i{display:inline-block;width:12px;height:12px}
#maw-entrance-study-v1 .terrain-swatch{background:color-mix(in srgb,var(--orange) 28%,var(--background))}
#maw-entrance-study-v1 .tooth-swatch{background:var(--foreground);clip-path:polygon(0 100%,0 0,100% 55%)}
#maw-entrance-study-v1 .pool-swatch{background:var(--yellow)}
#maw-entrance-study-v1 .route-swatch{border-bottom:2px dashed var(--blue);height:4px!important}
#maw-entrance-study-v1 .maw-scene text{fill:var(--foreground);font-size:var(--font-size-sm,12px)}
</style>
<script>
(()=>{
  const root=document.getElementById('maw-entrance-study-v1');
  const svg=root.querySelector('.maw-scene');
  const data=__MAW_LAYOUT__;
  const NS='http://www.w3.org/2000/svg';
  const el=(tag,attrs,parent=svg)=>{const n=document.createElementNS(NS,tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);parent.appendChild(n);return n;};
  function draw(){
    const width=root.getBoundingClientRect().width;
    if(!width)return;
    const scale=(width-16)/data.width, top=30, height=data.height*scale+70;
    svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
    svg.style.height=`${height}px`;
    svg.replaceChildren();
    const x=v=>8+v*scale,y=v=>top+v*scale;
    const label=(text,xx,yy,anchor='start')=>{const n=el('text',{x:xx,y:yy,'text-anchor':anchor});n.textContent=text;};
    el('line',{x1:x(0),y1:y(data.groundY),x2:x(120),y2:y(data.groundY),stroke:'var(--border)','stroke-dasharray':'3 5'});
    const colors={1:'color-mix(in srgb,var(--orange) 25%,var(--background))',2:'var(--foreground)',3:'color-mix(in srgb,var(--yellow) 68%,var(--background))'};
    const group=el('g',{'shape-rendering':'crispEdges'});
    for(const [xx,yy,ww,kind] of data.runs)el('rect',{x:x(xx),y:y(yy),width:ww*scale+.03,height:scale+.03,fill:colors[kind]},group);
    for(const poly of data.terrain)el('polyline',{points:poly.map(([xx,yy])=>`${x(xx)},${y(yy)}`).join(' '),fill:'none',stroke:'var(--orange)','stroke-width':1,opacity:.7});
    el('polyline',{points:data.route.map(([xx,yy])=>`${x(xx)},${y(yy)}`).join(' '),fill:'none',stroke:'var(--blue)','stroke-width':1.5,'stroke-dasharray':'3 5',opacity:.75});
    const box=data.player;
    el('rect',{x:x(box.x),y:y(box.y),width:box.width*scale,height:box.height*scale,fill:'var(--blue)',stroke:'var(--blue)','stroke-width':1});
    label('A',x(23),y(data.basins[0].surfaceY+3),'middle'); label('B',x(99),y(data.basins[1].surfaceY+3),'middle');
    label('Player',x(box.x),y(box.y-4));
    el('line',{x1:x(box.x+2),y1:y(box.y-3),x2:x(box.x+1),y2:y(box.y),stroke:'var(--blue)'});
    label(`Rims +${data.rimHeights[0]} / +${data.rimHeights[1]} tiles`,x(60),y(4),'middle');
    label('To existing Gullet',x(65),height-9,'middle');
    const by=height-25;
    el('path',{d:`M${x(1)},${by-3}v6 M${x(1)},${by}H${x(11)} M${x(11)},${by-3}v6`,stroke:'var(--foreground)',fill:'none'});
    label('10 tiles',x(1),height-9);
  }
  new ResizeObserver(draw).observe(root);draw();
})();
</script>
